name: Release Latest (Master)

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build binary (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact_name: simply_hook_executor-x86_64-linux-musl
          - target: aarch64-unknown-linux-musl
            artifact_name: simply_hook_executor-aarch64-linux-musl

    steps:
      - name: Checkout code
        uses: actions/checkout@main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: cross build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir staging
          cp target/${{ matrix.target }}/release/simply_hook_executor staging/
          cp README.md LICENSE staging/
          cp -r deploy staging/
          cp -r static staging/
          tar -czf ${{ matrix.artifact_name }}.tar.gz -C staging .

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Latest Master Build"
          body: "Latest Master Build to install in production."
          prerelease: false
          files: ${{ matrix.artifact_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}