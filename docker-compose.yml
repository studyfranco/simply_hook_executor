version: '3.8'

services:
  simply-hook-executor:
    build: .
    container_name: simply_hook_executor
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=sqlite://data/simply_hook_executor.db?mode=rwc
      - RUST_LOG=info
      - ALLOWED_ENV_VARS=PATH,LANG,TERM
      - LOG_RETENTION_DAYS=30
      # Keep 0.0.0.0 inside the container; change the published port mapping above instead.
      - BIND_HOST=0.0.0.0
      - PORT=3000
    volumes:
      - ./data:/app/data
      # Hook scripts must exist inside the container for the daemon to execute them.
      - ./hooks:/opt/hooks:ro
    restart: unless-stopped
