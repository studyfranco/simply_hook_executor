[package]
name = "simply_hook_executor"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
# All three SQL drivers stay enabled on purpose: AGENT.MD requires the codebase to remain
# SQL-agnostic and PostgreSQL-ready, even though SQLite is the zero-config default.
sea-orm = { version = "2", features = ["sqlx-postgres", "sqlx-mysql", "sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono"] }
# All three backend features, matching `sea-orm` above. Without `sqlx-postgres`/`sqlx-mysql` here,
# `SchemaManager::has_index`/`has_table`/`has_column` compile only the SQLite match arm in *this*
# crate and hit `DbErr::BackendNotSupported` on Postgres/MySQL at runtime — a silent portability
# hole `cargo check` cannot catch, since the code compiles fine and only the backend match arms
# differ. `src/master.rs` calls `has_index` on every boot to verify RBAC_MODEL.md §5's uniqueness
# index; AGENT.MD requires the daemon stay SQL-agnostic and PostgreSQL-ready, so this crate's
# feature set must not silently narrow that promise.
sea-orm-migration = { version = "2", features = ["runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres", "sqlx-mysql"] }
ipnetwork = "0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
hmac = "0.13"
tower-http = { version = "0.7", features = ["fs", "trace"] }
hex = "0.4"
rand = "0.10"
thiserror = "2"
dotenvy = "0.15"
# Not a second logging stack — every diagnostic in this codebase goes through `tracing`. This is
# here for exactly one call: `ConnectOptions::sqlx_logging_level` takes a `log::LevelFilter`, so
# naming that type requires the crate as a direct dependency even though it arrives via SeaORM
# anyway. Deleting it as "obviously superseded by tracing" breaks the build in `src/main.rs`.
log = "0.4"
# Used solely for `killpg(2)` when a hook exceeds its timeout: `tokio::process::Child::kill()`
# only signals the direct child, which would leave orphaned grandchildren behind. Already in the
# dependency tree via tokio on Unix, so this adds no new compilation.
libc = "0.2"
# Encryption-at-rest for `api_keys.signing_secret`. HMAC verification needs the secret back in
# plaintext to recompute a signature, so — unlike `key_hash` — it cannot be hashed. XChaCha20-Poly1305
# (pure Rust, no C toolchain) keeps a database-only compromise from yielding forgeable signatures.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "getrandom"] }

[dev-dependencies]
# `ServiceExt::oneshot`, used to drive the real router in integration tests without binding a port.
tower = { version = "0.5", features = ["util"] }
# Scratch directories that clean themselves up on drop, for tests needing a real file on disk —
# script fixtures a handler must stat before inserting, and anything file-backed. `Drop` rather than
# a trailing `remove_dir_all`: a failing assertion unwinds, and a cleanup line placed after it is
# skipped, leaving litter behind on exactly the runs you re-run most. All three sibling services
# under `example/` carry it for the same reason.
tempfile = "3"
# `test-util` unlocks the pausable clock (`tokio::time::pause`/`advance`). `src/replay.rs` expires
# entries against `tokio::time::Instant`, so its window, sweep and capacity-backoff behaviour can be
# driven exactly rather than by sleeping for real seconds in the test suite. Test-only: it is not
# compiled into the daemon.
tokio = { version = "1", features = ["full", "test-util"] }
# Parses `static/app.js` in `tests/source_hygiene.rs`. `static/` is served straight off disk by
# `ServeDir` and is never compiled, linted, or executed by anything else here, so a syntax error in
# it passes `cargo check`, `cargo clippy`, `cargo test` and the whole e2e suite — every one of which
# exercises the HTTP API and never parses the file it is serving. The first thing to notice would be
# a human opening the dashboard and finding it dead.
#
# Deliberately a *parser* and not an engine: `app.js` references `document`, `localStorage` and
# `fetch`, so executing it would fail for reasons that have nothing to do with syntax, and telling
# those failures apart would mean pattern-matching on error text.
#
# Pinned with `=`, unlike every other dependency here. `oxc` is pre-1.0, so its `0.x` releases carry
# breaking changes under a caret requirement — `ParserReturn::errors` became `diagnostics`, `labels`
# went from `Option<Vec<_>>` to a slice, `offset()` widened to `u32`. A syntax checker that stops the
# build for reasons unrelated to syntax is worse than no checker, so this one does not float.
oxc_allocator = "0.145"
oxc_parser = "0.145"
oxc_span = "0.145"
